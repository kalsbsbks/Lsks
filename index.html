<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP-Erkennung & Foto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="image-section">
                <img src="foto.jpg" alt="Foto" class="foto">
            </div>
            
            <div class="info-section">
                <h1>IP-Informationen</h1>
                <div class="info-box">
                    <p><strong>Deine IP-Adresse:</strong></p>
                    <p id="ip-display">Wird geladen...</p>
                </div>
                
                <div class="info-box">
                    <p><strong>Standort:</strong></p>
                    <p id="location-display">Wird geladen...</p>
                </div>
                
                <div class="info-box">
                    <p><strong>Weitere Informationen:</strong></p>
                    <p id="details-display">Wird geladen...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
